name: Build Plumage (Android · iOS · Windows)

on:
  push:
    branches: [ main ]
    tags: [ 'v*' ]
  workflow_dispatch:
  release:
    types: [ published ]

permissions:
  contents: write

jobs:
  android:
    name: Android APK
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Install dependencies
        run: npm install
      - name: Add Android platform
        run: npx cap add android
      - name: Patch permissions
        run: node scripts/patch-android.mjs
      - name: Sync web assets
        run: npx cap sync android
      - name: Build debug APK
        run: |
          cd android
          chmod +x ./gradlew
          ./gradlew assembleDebug
      - name: Stage APK
        run: |
          mkdir -p out
          cp android/app/build/outputs/apk/debug/app-debug.apk out/Plumage.apk
      - uses: actions/upload-artifact@v4
        with:
          name: Plumage-Android-APK
          path: out/Plumage.apk
      - name: Publish to release
        if: github.event_name == 'workflow_dispatch' || github.event_name == 'release' || startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.0
          name: Plumage v1.0.0
          files: out/Plumage.apk

  ios:
    name: iOS IPA (unsigned)
    runs-on: macos-13
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Install dependencies
        run: npm install
      - name: Add iOS platform
        run: npx cap add ios
      - name: Patch permissions
        run: bash scripts/patch-ios.sh
      - name: Sync web assets
        run: npx cap sync ios
      - name: Build unsigned .app
        run: |
          xcodebuild -workspace ios/App/App.xcworkspace \
            -scheme App -configuration Release -sdk iphoneos \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" PROVISIONING_PROFILE="" \
            clean build
      - name: Package unsigned IPA
        run: |
          mkdir -p out Payload
          cp -R build/Build/Products/Release-iphoneos/App.app Payload/
          zip -r out/Plumage-iPhone-unsigned.ipa Payload
      - uses: actions/upload-artifact@v4
        with:
          name: Plumage-iOS-IPA
          path: out/Plumage-iPhone-unsigned.ipa
      - name: Publish to release
        if: github.event_name == 'workflow_dispatch' || github.event_name == 'release' || startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.0
          name: Plumage v1.0.0
          files: out/Plumage-iPhone-unsigned.ipa

  windows:
    name: Windows installer (.exe)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Install dependencies
        run: npm install
      - name: Build Windows installer
        run: npx electron-builder --win --publish never
      - name: Stage installer
        shell: bash
        run: |
          mkdir -p out
          cp dist-win/*.exe out/ || true
      - uses: actions/upload-artifact@v4
        with:
          name: Plumage-Windows-Setup
          path: out/*.exe
      - name: Publish to release
        if: github.event_name == 'workflow_dispatch' || github.event_name == 'release' || startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.0
          name: Plumage v1.0.0
          files: out/*.exe
